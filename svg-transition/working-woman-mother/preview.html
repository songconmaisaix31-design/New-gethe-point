<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Working Woman and Mother Transition</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #181714; background: #f4f1eb; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; }
      main { width: 100%; max-width: 1120px; min-width: 0; }
      h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 46px); letter-spacing: -.045em; }
      .intro { margin: 0 0 24px; color: #68635b; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; min-width: 0; }
      .card { width: 100%; min-width: 0; padding: 18px; border: 1px solid #ded9cf; border-radius: 24px; background: #fff; box-shadow: 0 18px 50px rgba(46, 38, 27, .08); }
      .stage { display: grid; place-items: center; width: 100%; min-width: 0; aspect-ratio: 1; overflow: hidden; border-radius: 16px; background: linear-gradient(145deg, #fbfaf7, #eee9df); }
      object { display: block; width: 92%; max-width: 100%; min-width: 0; height: 92%; color: #171614; }
      .meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; }
      .label { font-weight: 680; letter-spacing: -.02em; }
      button { border: 0; border-radius: 999px; padding: 9px 14px; color: #fff; background: #181714; font: inherit; cursor: pointer; }
      button:hover { background: #3b3832; }
      button:focus-visible { outline: 3px solid #8f7cff; outline-offset: 3px; }
      @media (max-width: 820px) { body { display: block; padding: 20px; } .grid { grid-template-columns: minmax(0, 1fr); } .card { max-width: none; margin-inline: 0; } }
    </style>
  </head>
  <body>
    <main>
      <h1>One woman, two roles</h1>
      <p class="intro">A shared silhouette language connects focused work and everyday home life.</p>
      <section class="grid" aria-label="Mother role and bidirectional transitions">
        <article class="card">
          <div class="stage"><object data="mother.svg" type="image/svg+xml" aria-label="Mother role"></object></div>
          <div class="meta"><span class="label">Mother</span></div>
        </article>
        <article class="card">
          <div class="stage"><object id="worker-to-mother" data="working-woman-to-mother.svg" type="image/svg+xml" aria-label="Working woman to mother"></object></div>
          <div class="meta"><span class="label">Work → Home</span><button data-replay="worker-to-mother">Replay</button></div>
        </article>
        <article class="card">
          <div class="stage"><object id="mother-to-worker" data="mother-to-working-woman.svg" type="image/svg+xml" aria-label="Mother to working woman"></object></div>
          <div class="meta"><span class="label">Home → Work</span><button data-replay="mother-to-worker">Replay</button></div>
        </article>
      </section>
    </main>
    <script>
      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-replay]");
        if (!button) return;
        const animation = document.getElementById(button.dataset.replay);
        const source = animation.data;
        animation.data = "about:blank";
        requestAnimationFrame(() => { animation.data = source; });
      });
    </script>
  </body>
</html>
