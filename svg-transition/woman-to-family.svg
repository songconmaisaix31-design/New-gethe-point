<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Working woman transitions to family</title>
  <desc id="description">A smooth radial reveal transitions from a working woman icon to a family icon.</desc>
  <metadata>
    Working Woman by sentya irma from Noun Project, icon 7641720, Creative Commons.
    Family artwork supplied by the user from SVG Repo.
  </metadata>
  <defs>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0" />
    </filter>
    <mask id="family-reveal" maskUnits="userSpaceOnUse">
      <rect width="512" height="512" fill="black" />
      <circle class="reveal-disc" cx="256" cy="286" r="0" fill="white" />
    </mask>
    <style>
      :root { --duration: 1.8s; --ease: cubic-bezier(.22, 1, .36, 1); }
      .source,
      .destination,
      .reveal-disc,
      .transition-ring { transform-box: fill-box; transform-origin: center; }
      .source {
        animation: source-out var(--duration) var(--ease) .15s forwards;
      }
      .destination {
        opacity: 0;
        mask: url(#family-reveal);
        animation: destination-in var(--duration) var(--ease) .15s forwards;
      }
      .reveal-disc {
        animation: reveal var(--duration) var(--ease) .15s forwards;
      }
      .transition-ring {
        fill: none;
        stroke: currentColor;
        stroke-width: 3;
        opacity: 0;
        animation: ring var(--duration) var(--ease) .15s forwards;
      }
      @keyframes source-out {
        0%, 18% { opacity: 1; filter: blur(0); transform: scale(1) translateY(0); }
        60% { opacity: .42; filter: blur(3px); transform: scale(.94) translateY(-3px); }
        100% { opacity: 0; filter: blur(8px); transform: scale(.86) translateY(-8px); }
      }
      @keyframes destination-in {
        0%, 12% { opacity: 0; filter: blur(7px); transform: scale(.84) translateY(9px); }
        52% { opacity: .7; filter: blur(2px); }
        100% { opacity: 1; filter: blur(0); transform: scale(1) translateY(0); }
      }
      @keyframes reveal {
        0%, 10% { r: 0; }
        100% { r: 390px; }
      }
      @keyframes ring {
        0%, 8% { opacity: 0; r: 0; stroke-width: 5; }
        35% { opacity: .2; }
        100% { opacity: 0; r: 390px; stroke-width: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .source { animation: none; opacity: 0; }
        .destination { animation: none; opacity: 1; filter: none; transform: none; }
        .reveal-disc { animation: none; r: 390px; }
        .transition-ring { animation: none; opacity: 0; }
      }
    </style>
  </defs>

  <g class="source">
    <image href="data:image/png;base64," width="512" height="512" />
  </g>

  <g class="destination" fill="currentColor">
