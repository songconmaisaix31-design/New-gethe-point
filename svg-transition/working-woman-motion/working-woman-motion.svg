<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="motion-title motion-description">
  <title id="motion-title">Animated working woman</title>
  <desc id="motion-description">A woman and her laptop assemble in a calm, focused motion.</desc>
  <metadata>
    Working Woman by sentya irma from Noun Project, icon 7641720, Creative Commons.
    Animation authored for the user with a 1600 millisecond staged reveal.
  </metadata>
  <style>
    :root { --p2m-duration: 1600ms; --p2m-ease-enter: cubic-bezier(0.16, 1, 0.3, 1); --p2m-ease-settle: cubic-bezier(0.22, 1, 0.36, 1); }
    #person, #laptop-screen, #laptop-base { transform-box: fill-box; transform-origin: center; will-change: transform, opacity; }
    #person { animation: person-arrive var(--p2m-duration) var(--p2m-ease-enter) both; }
    #laptop-screen { transform-origin: 12% 92%; animation: screen-open var(--p2m-duration) var(--p2m-ease-enter) both; }
    #laptop-base { animation: base-arrive var(--p2m-duration) var(--p2m-ease-settle) both; }
    @keyframes person-arrive {
      0%, 14% { opacity: 0; transform: translateY(18px) scale(0.97); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
      62% { opacity: 1; transform: translateY(-3px) scale(1.006); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      82% { opacity: 1; transform: translateY(1px) scale(0.998); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes screen-open {
      0%, 24% { opacity: 0; transform: translateX(-18px) translateY(8px) rotate(-5deg) scale(0.96); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
      68% { opacity: 1; transform: translateX(2px) translateY(-1px) rotate(0.6deg) scale(1.008); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      86% { opacity: 1; transform: translateX(0) translateY(0) rotate(-0.2deg) scale(1); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      100% { opacity: 1; transform: none; }
    }
    @keyframes base-arrive {
      0%, 38% { opacity: 0; transform: translateX(-14px) scaleX(0.72); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
      74% { opacity: 1; transform: translateX(1px) scaleX(1.01); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      100% { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) { #person, #laptop-screen, #laptop-base { animation: none; opacity: 1; transform: none; } }
  </style>
  <g fill="#000" fill-rule="evenodd" shape-rendering="geometricPrecision">
    <path id="person" d="M 365 74 L 381 75 L 396 82 L 404 90 L 410 101 L 412 117 L 409 127 L 402 135 L 406 152 L 406 176 L 399 199 L 394 207 L 382 218 L 369 223 L 357 224 L 352 229 L 352 246 L 382 256 L 412 270 L 427 287 L 454 332 L 486 393 L 486 406 L 481 415 L 472 421 L 358 431 L 345 430 L 336 421 L 285 422 L 284 397 L 278 394 L 270 394 L 270 360 L 265 362 L 237 394 L 207 394 L 201 360 L 252 273 L 260 264 L 273 257 L 303 249 L 303 237 L 287 223 L 275 202 L 271 189 L 269 161 L 275 135 L 287 112 L 299 100 L 321 90 L 343 90 L 352 79 Z M 290 144 L 286 160 L 287 181 L 292 198 L 299 211 L 314 224 L 327 224 L 336 220 L 349 207 L 352 195 L 364 188 L 366 184 L 364 173 L 358 181 L 349 182 L 339 172 L 307 158 Z M 401 348 L 396 388 L 427 384 Z M 334 238 L 328 241 L 320 241 L 320 254 L 331 256 L 335 253 Z" />
    <path id="laptop-screen" d="M 24 283 L 168 284 L 173 291 L 200 437 L 47 427 L 42 419 L 20 297 L 20 287 Z" />
    <path id="laptop-base" d="M 211 410 L 270 410 L 270 438 L 216 438 Z" />
  </g>
</svg>
