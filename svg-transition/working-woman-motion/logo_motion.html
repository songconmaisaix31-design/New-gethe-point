<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Working Woman Motion</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --surface: #f5f5f3;
      --border: rgba(0,0,0,0.08);
      --text-primary: #0d0d0d;
      --text-secondary: #777;
      --text-tertiary: #aaa;
      --accent: #e64036;
      --speed-progress: 9%;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    #logo-root {
      width: min(92vw, 358.4px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #logo-root svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
      text-rendering: geometricPrecision;
    }

    .atomic-motions {
      display: flex;
      gap: 1.5rem;
      align-items: flex-end;
      justify-content: center;
      flex-wrap: wrap;
    }

    .atom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .atom-stage {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .atom-stage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 260ms cubic-bezier(0.34,1.56,0.64,1);
      transform-origin: center;
    }

    .atom-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    .principles {
      max-width: 760px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      font-size: 11px;
      line-height: 1;
      padding: 5px 10px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .pill.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font: 12px/1.2 inherit;
      letter-spacing: 0.04em;
      padding: 8px 18px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
    }

    button.primary {
      color: var(--bg);
      background: var(--text-primary);
      border-color: var(--text-primary);
    }

    .speed-control {
      width: min(340px, 80vw);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
    }

    .speed-caption,
    .speed-value {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .speed-value {
      min-width: 46px;
      text-align: right;
      color: var(--text-primary);
      text-transform: none;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      flex: 1;
      min-width: 120px;
      height: 24px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: grab;
      accent-color: var(--accent);
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--speed-progress), var(--border) var(--speed-progress), var(--border) 100%);
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -6.5px;
      border-radius: 50%;
      border: 2px solid var(--bg);
      background: var(--accent);
      box-shadow: 0 1px 6px rgba(0,0,0,0.18);
    }

    .footer {
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: center;
      line-height: 1.7;
    }

    .p2m-chromeless .atomic-motions,
    .p2m-chromeless .principles,
    .p2m-chromeless .controls,
    .p2m-chromeless .footer {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      :root {
        --p2m-duration: 1600ms;
        --p2m-ease-enter: cubic-bezier(0.16, 1, 0.3, 1);
        --p2m-ease-settle: cubic-bezier(0.22, 1, 0.36, 1);
      }

      #person,
      #laptop-screen,
      #laptop-base {
        transform-box: fill-box;
        transform-origin: center;
        will-change: transform, opacity;
      }

      #person {
        animation: person-arrive var(--p2m-duration) var(--p2m-ease-enter) both;
      }

      #laptop-screen {
        transform-origin: 12% 92%;
        animation: screen-open var(--p2m-duration) var(--p2m-ease-enter) both;
      }

      #laptop-base {
        animation: base-arrive var(--p2m-duration) var(--p2m-ease-settle) both;
      }

      @keyframes person-arrive {
        0%, 14% {
          opacity: 0;
          transform: translateY(18px) scale(0.97);
          animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); /* enter */
        }
        62% {
          opacity: 1;
          transform: translateY(-3px) scale(1.006);
          animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); /* settle */
        }
        82% {
          opacity: 1;
          transform: translateY(1px) scale(0.998);
          animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); /* settle */
        }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes screen-open {
        0%, 24% {
          opacity: 0;
          transform: translateX(-18px) translateY(8px) rotate(-5deg) scale(0.96);
          animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); /* enter */
        }
        68% {
          opacity: 1;
          transform: translateX(2px) translateY(-1px) rotate(0.6deg) scale(1.008);
          animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); /* settle */
        }
        86% {
          opacity: 1;
          transform: translateX(0) translateY(0) rotate(-0.2deg) scale(1);
          animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); /* settle */
        }
        100% { opacity: 1; transform: none; }
      }

      @keyframes base-arrive {
        0%, 38% {
          opacity: 0;
          transform: translateX(-14px) scaleX(0.72);
          animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); /* enter */
        }
        74% {
          opacity: 1;
          transform: translateX(1px) scaleX(1.01);
          animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); /* settle */
        }
        100% { opacity: 1; transform: none; }
      }
    }
  </style>
</head>
<body>
  <main id="logo-root" aria-label="Animated logo" data-p2m-duration="1600"></main>

  <section class="atomic-motions" aria-label="Atomic motion studies">
    <div class="atom" data-atom="hover"><div class="atom-stage"></div><span class="atom-label">Hover</span></div>
    <div class="atom" data-atom="pulse"><div class="atom-stage"></div><span class="atom-label">Pulse</span></div>
    <div class="atom" data-atom="arc"><div class="atom-stage"></div><span class="atom-label">Arc</span></div>
    <div class="atom" data-atom="press"><div class="atom-stage"></div><span class="atom-label">Press</span></div>
  </section>

  <div class="principles" id="principlesRow">
    <span class="pill" data-p="squashstretch">Squash &amp; stretch</span>
    <span class="pill" data-p="anticipation">Anticipation</span>
    <span class="pill" data-p="staging">Staging</span>
    <span class="pill" data-p="followthrough">Follow through</span>
    <span class="pill" data-p="overlap">Overlapping</span>
    <span class="pill" data-p="slowinout">Slow in / out</span>
    <span class="pill" data-p="arc">Arc</span>
    <span class="pill" data-p="secondary">Secondary action</span>
    <span class="pill" data-p="timing">Timing</span>
    <span class="pill" data-p="appeal">Appeal</span>
  </div>

  <div class="controls">
    <button class="primary" id="btnReplay" type="button">Replay</button>
    <button id="btnSlow" type="button">Slow motion</button>
    <label class="speed-control" for="speedSlider">
      <span class="speed-caption">Speed</span>
      <input id="speedSlider" type="range" min="0.25" max="2.5" step="0.05" value="0.45" aria-label="Animation speed">
      <span class="speed-value" id="speedValue">0.45x</span>
    </label>
  </div>

  <p class="footer">Click the main logo to replay | Drag speed | Try atomic motions</p>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const LOGO = {"tag":"svg","attrs":{"width":"512","height":"512","viewBox":"0 0 512 512","role":"img","aria-labelledby":"title description"},"children":[{"tag":"title","attrs":{"id":"title"},"children":[],"text":"Working woman"},{"tag":"desc","attrs":{"id":"description"},"children":[],"text":"A woman working at a laptop."},{"tag":"metadata","attrs":{},"children":[],"text":"Working Woman by sentya irma from Noun Project, icon 7641720, Creative Commons."},{"tag":"g","attrs":{"fill":"#000","fill-rule":"evenodd","shape-rendering":"geometricPrecision"},"children":[{"tag":"path","attrs":{"id":"person","d":"M 365 74 L 381 75 L 396 82 L 404 90 L 410 101 L 412 117 L 409 127 L 402 135 L 406 152 L 406 176 L 399 199 L 394 207 L 382 218 L 369 223 L 357 224 L 352 229 L 352 246 L 382 256 L 412 270 L 427 287 L 454 332 L 486 393 L 486 406 L 481 415 L 472 421 L 358 431 L 345 430 L 336 421 L 285 422 L 284 397 L 278 394 L 270 394 L 270 360 L 265 362 L 237 394 L 207 394 L 201 360 L 252 273 L 260 264 L 273 257 L 303 249 L 303 237 L 287 223 L 275 202 L 271 189 L 269 161 L 275 135 L 287 112 L 299 100 L 321 90 L 343 90 L 352 79 Z M 290 144 L 286 160 L 287 181 L 292 198 L 299 211 L 314 224 L 327 224 L 336 220 L 349 207 L 352 195 L 364 188 L 366 184 L 364 173 L 358 181 L 349 182 L 339 172 L 307 158 Z M 401 348 L 396 388 L 427 384 Z M 334 238 L 328 241 L 320 241 L 320 254 L 331 256 L 335 253 Z"},"children":[]},{"tag":"path","attrs":{"id":"laptop-screen","d":"M 24 283 L 168 284 L 173 291 L 200 437 L 47 427 L 42 419 L 20 297 L 20 287 Z"},"children":[]},{"tag":"path","attrs":{"id":"laptop-base","d":"M 211 410 L 270 410 L 270 438 L 216 438 Z"},"children":[]}]}]};
    const SVG_TEXT = "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"512\" height=\"512\" viewBox=\"0 0 512 512\" role=\"img\" aria-labelledby=\"title description\"><style>:root,svg{--bg:#ffffff;--surface:#f5f5f3;--text-primary:#0d0d0d;--text-secondary:#777;--text-tertiary:#aaa;--logo-wordmark:#363e47;--accent:#e64036;--red:#e64036;--red-bright:#ff493f;}<\/style>\n  <title id=\"title\">Working woman<\/title>\n  <desc id=\"description\">A woman working at a laptop.<\/desc>\n  <metadata>\n    Working Woman by sentya irma from Noun Project, icon 7641720, Creative Commons.\n  <\/metadata>\n  <g fill=\"#000\" fill-rule=\"evenodd\" shape-rendering=\"geometricPrecision\">\n    <path id=\"person\" d=\"M 365 74 L 381 75 L 396 82 L 404 90 L 410 101 L 412 117 L 409 127 L 402 135 L 406 152 L 406 176 L 399 199 L 394 207 L 382 218 L 369 223 L 357 224 L 352 229 L 352 246 L 382 256 L 412 270 L 427 287 L 454 332 L 486 393 L 486 406 L 481 415 L 472 421 L 358 431 L 345 430 L 336 421 L 285 422 L 284 397 L 278 394 L 270 394 L 270 360 L 265 362 L 237 394 L 207 394 L 201 360 L 252 273 L 260 264 L 273 257 L 303 249 L 303 237 L 287 223 L 275 202 L 271 189 L 269 161 L 275 135 L 287 112 L 299 100 L 321 90 L 343 90 L 352 79 Z M 290 144 L 286 160 L 287 181 L 292 198 L 299 211 L 314 224 L 327 224 L 336 220 L 349 207 L 352 195 L 364 188 L 366 184 L 364 173 L 358 181 L 349 182 L 339 172 L 307 158 Z M 401 348 L 396 388 L 427 384 Z M 334 238 L 328 241 L 320 241 L 320 254 L 331 256 L 335 253 Z\" />\n    <path id=\"laptop-screen\" d=\"M 24 283 L 168 284 L 173 291 L 200 437 L 47 427 L 42 419 L 20 297 L 20 287 Z\" />\n    <path id=\"laptop-base\" d=\"M 211 410 L 270 410 L 270 438 L 216 438 Z\" />\n  <\/g>\n<\/svg>\n";
    const SVG_URI = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(SVG_TEXT);
    const DURATION = 1600;

    let playbackRate = 0.45;
    let pulseRaf = null;
    let arcRaf = null;
    window.__p2mReady = false;

    function createSvgNode(node) {
      const element = document.createElementNS(SVG_NS, node.tag);
      for (const [name, value] of Object.entries(node.attrs || {})) {
        element.setAttribute(name, value);
      }
      if (node.text) {
        element.appendChild(document.createTextNode(node.text));
      }
      for (const child of node.children || []) {
        element.appendChild(createSvgNode(child));
      }
      return element;
    }

    function heroAnimations() {
      const root = document.getElementById("logo-root");
      if (root.getAnimations) return root.getAnimations({ subtree: true });
      return document.getAnimations().filter(animation => {
        const target = animation.effect && animation.effect.target;
        return target && root.contains(target);
      });
    }

    function applyPlaybackRate() {
      for (const animation of heroAnimations()) {
        if (animation.updatePlaybackRate) animation.updatePlaybackRate(playbackRate);
        else animation.playbackRate = playbackRate;
      }
    }

    function renderHero() {
      const root = document.getElementById("logo-root");
      root.replaceChildren(createSvgNode(LOGO));
      const svg = root.querySelector("svg");
      if (svg) {
        svg.removeAttribute("width");
        svg.removeAttribute("height");
        svg.style.width = "100%";
        svg.style.height = "auto";
        svg.style.overflow = "visible";
      }
      requestAnimationFrame(() => requestAnimationFrame(applyPlaybackRate));
    }

    function flashPills(...names) {
      document.querySelectorAll(".pill").forEach(pill => pill.classList.remove("active"));
      names.forEach(name => {
        const pill = document.querySelector(`[data-p="${name}"]`);
        if (pill) pill.classList.add("active");
      });
    }

    function cyclePrinciples() {
      const phases = [
        ["staging", "timing"],
        ["anticipation", "squashstretch"],
        ["arc", "slowinout"],
        ["overlap", "followthrough"],
        ["appeal"]
      ];
      let i = 0;
      flashPills(...phases[0]);
      return setInterval(() => {
        i = (i + 1) % phases.length;
        flashPills(...phases[i]);
      }, Math.max(240, DURATION / phases.length / Math.max(playbackRate, 0.25)));
    }

    let pillTimer = null;
    function replayMain() {
      clearInterval(pillTimer);
      renderHero();
      pillTimer = cyclePrinciples();
      setTimeout(() => {
        clearInterval(pillTimer);
        document.querySelectorAll(".pill").forEach(pill => pill.classList.remove("active"));
      }, DURATION / Math.max(playbackRate, 0.25) + 600);
    }

    function formatSpeed(rate) {
      return `${rate.toFixed(2)}x`;
    }

    function updateSpeedUI() {
      const slider = document.getElementById("speedSlider");
      const value = Number(slider.value);
      const min = Number(slider.min);
      const max = Number(slider.max);
      const progress = ((value - min) / (max - min)) * 100;
      document.getElementById("speedValue").textContent = formatSpeed(value);
      slider.style.setProperty("--speed-progress", `${progress}%`);
      const slow = value <= 0.251;
      const btnSlow = document.getElementById("btnSlow");
      btnSlow.textContent = slow ? "Normal speed" : "Slow motion";
      btnSlow.style.background = slow ? "var(--surface)" : "";
      btnSlow.style.borderColor = slow ? "var(--text-secondary)" : "";
    }

    function setPlaybackRate(rate, replay = false) {
      const slider = document.getElementById("speedSlider");
      const min = Number(slider.min);
      const max = Number(slider.max);
      playbackRate = Math.min(max, Math.max(min, Number(rate)));
      slider.value = String(playbackRate);
      updateSpeedUI();
      applyPlaybackRate();
      if (replay) replayMain();
    }

    function setupAtomImages() {
      document.querySelectorAll(".atom-stage").forEach(stage => {
        const img = new Image();
        img.src = SVG_URI;
        img.alt = "";
        stage.appendChild(img);
      });
    }

    function setupAtoms() {
      const hover = document.querySelector('[data-atom="hover"] img');
      const pulse = document.querySelector('[data-atom="pulse"] img');
      const arc = document.querySelector('[data-atom="arc"] img');
      const press = document.querySelector('[data-atom="press"] img');

      hover.parentElement.addEventListener("mouseenter", () => {
        flashPills("squashstretch", "appeal");
        hover.style.transform = "scale(1.08) rotate(-1.5deg)";
      });
      hover.parentElement.addEventListener("mouseleave", () => {
        hover.style.transform = "scale(1)";
      });

      function pulseTick(ts) {
        const p = (Math.sin(ts / 900) + 1) / 2;
        pulse.style.transform = `scale(${1 + 0.1 * p})`;
        pulseRaf = requestAnimationFrame(pulseTick);
      }
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        pulseRaf = requestAnimationFrame(pulseTick);
      }

      let arcAngle = -14;
      let arcVel = 0;
      function arcTick() {
        arcVel += (0 - arcAngle) * 0.08;
        arcVel *= 0.86;
        arcAngle += arcVel;
        arc.style.transform = `rotate(${arcAngle}deg)`;
        arcRaf = requestAnimationFrame(arcTick);
      }
      arc.parentElement.addEventListener("mouseenter", () => {
        flashPills("arc", "anticipation", "appeal");
        cancelAnimationFrame(arcRaf);
        arcAngle = 28;
        arcVel = 0;
        arcTick();
      });
      arc.parentElement.addEventListener("mouseleave", () => {
        arcAngle = 0;
      });

      press.parentElement.addEventListener("mousedown", () => {
        flashPills("squashstretch", "anticipation");
        press.style.transform = "scaleX(1.10) scaleY(0.88)";
      });
      ["mouseup", "mouseleave"].forEach(ev => {
        press.parentElement.addEventListener(ev, () => {
          press.style.transform = "scale(1)";
        });
      });
    }

    function applyQaMode() {
      const params = new URLSearchParams(location.search);
      const seekMs = params.get("t");
      const staticMode = params.get("static");
      if (seekMs === null && staticMode === null) {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          applyPlaybackRate();
          window.__p2mReady = true;
        }));
        return;
      }

      document.documentElement.classList.add("p2m-chromeless");
      cancelAnimationFrame(pulseRaf);
      cancelAnimationFrame(arcRaf);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        for (const animation of heroAnimations()) {
          if (staticMode !== null) {
            try {
              animation.finish();
            } catch (err) {
              animation.cancel();
            }
          } else {
            animation.pause();
            animation.currentTime = Number(seekMs);
          }
        }
        window.__p2mReady = true;
      }));
    }

    document.getElementById("btnReplay").addEventListener("click", replayMain);
    document.getElementById("logo-root").addEventListener("click", replayMain);
    document.getElementById("speedSlider").addEventListener("input", event => {
      setPlaybackRate(event.target.value, false);
    });
    document.getElementById("btnSlow").addEventListener("click", () => {
      const slow = Number(document.getElementById("speedSlider").value) <= 0.251;
      setPlaybackRate(slow ? 0.45 : 0.25, true);
    });

    setupAtomImages();
    setupAtoms();
    setPlaybackRate(0.45, false);
    renderHero();
    applyQaMode();
  </script>
</body>
</html>
