<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Working woman transitions to mother</title>
  <desc id="description">The laptop folds into a saucepan as the same woman appears cooking in an apron.</desc>
  <metadata>
    Working Woman by sentya irma from Noun Project, icon 7641720, Creative Commons. Mother-role artwork and animation are original derivatives.
  </metadata>
  <defs>
    <mask id="mother-reveal" maskUnits="userSpaceOnUse">
      <rect width="512" height="512" fill="#000" />
      <circle class="reveal-disc" cx="126" cy="356" r="0" fill="#fff" />
    </mask>
    <mask id="apron-cut" maskUnits="userSpaceOnUse">
      <rect width="512" height="512" fill="#fff" />
      <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
        <path d="M303 278 C302 315 299 353 296 389 M352 274 C353 315 362 355 373 389 M297 389 C320 400 350 400 373 389" stroke-width="9" />
        <path d="M316 344 C328 351 343 351 355 344" stroke-width="8" />
      </g>
    </mask>
    <style>
      :root { --duration: 2s; --enter: cubic-bezier(.16, 1, .3, 1); --settle: cubic-bezier(.22, 1, .36, 1); }
      .source-person, .source-screen, .source-base, .destination, .reveal-disc, .focus-ring { transform-box: fill-box; transform-origin: center; }
      .source-person { animation: person-out var(--duration) var(--enter) .12s forwards; }
      .source-screen { transform-origin: 90% 90%; animation: screen-fold var(--duration) var(--enter) .12s forwards; }
      .source-base { animation: base-fold var(--duration) var(--enter) .12s forwards; }
      .destination { opacity: 0; mask: url(#mother-reveal); animation: mother-in var(--duration) var(--settle) .12s forwards; }
      .reveal-disc { animation: reveal var(--duration) var(--enter) .12s forwards; }
      .focus-ring { fill: none; stroke: currentColor; stroke-width: 4; opacity: 0; animation: ring var(--duration) var(--settle) .12s forwards; }
      @keyframes person-out {
        0%, 24% { opacity: 1; transform: translateY(0) scale(1); animation-timing-function: cubic-bezier(.16, 1, .3, 1); }
        62% { opacity: .35; transform: translateY(-2px) scale(.985); animation-timing-function: cubic-bezier(.22, 1, .36, 1); }
        100% { opacity: 0; transform: translateY(2px) scale(.97); }
      }
      @keyframes screen-fold {
        0%, 18% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.16, 1, .3, 1); }
        64% { opacity: .7; transform: translate(2px, 42px) scale(.96, .48); animation-timing-function: cubic-bezier(.22, 1, .36, 1); }
        100% { opacity: 0; transform: translate(4px, 52px) scale(.94, .38); }
      }
      @keyframes base-fold {
        0%, 30% { opacity: 1; transform: none; animation-timing-function: cubic-bezier(.16, 1, .3, 1); }
        72% { opacity: .55; transform: translate(-12px, -12px) rotate(-8deg) scale(1.1, .7); }
        100% { opacity: 0; transform: translate(-18px, -18px) rotate(-12deg) scale(1.16, .58); }
      }
      @keyframes mother-in {
        0%, 16% { opacity: 0; transform: translateY(10px) scale(.92); animation-timing-function: cubic-bezier(.16, 1, .3, 1); }
        66% { opacity: 1; transform: translateY(-2px) scale(1.01); animation-timing-function: cubic-bezier(.22, 1, .36, 1); }
        84% { opacity: 1; transform: translateY(1px) scale(.997); animation-timing-function: cubic-bezier(.22, 1, .36, 1); }
        100% { opacity: 1; transform: none; }
      }
      @keyframes reveal { 0%, 16% { r: 0; } 100% { r: 470px; } }
      @keyframes ring { 0%, 16% { opacity: 0; r: 0; } 42% { opacity: .18; } 100% { opacity: 0; r: 470px; stroke-width: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .source-person, .source-screen, .source-base { animation: none; opacity: 0; }
        .destination { animation: none; opacity: 1; transform: none; }
        .reveal-disc { animation: none; r: 470px; }
        .focus-ring { animation: none; opacity: 0; }
      }
    </style>
  </defs>

  <g fill="currentColor" fill-rule="evenodd" shape-rendering="geometricPrecision">
    <path class="source-person" d="M365 74 L381 75 L396 82 L404 90 L410 101 L412 117 L409 127 L402 135 L406 152 L406 176 L399 199 L394 207 L382 218 L369 223 L357 224 L352 229 L352 246 L382 256 L412 270 L427 287 L454 332 L486 393 L486 406 L481 415 L472 421 L358 431 L345 430 L336 421 L285 422 L284 397 L278 394 L270 394 L270 360 L265 362 L237 394 L207 394 L201 360 L252 273 L260 264 L273 257 L303 249 L303 237 L287 223 L275 202 L271 189 L269 161 L275 135 L287 112 L299 100 L321 90 L343 90 L352 79 Z M290 144 L286 160 L287 181 L292 198 L299 211 L314 224 L327 224 L336 220 L349 207 L352 195 L364 188 L366 184 L364 173 L358 181 L349 182 L339 172 L307 158 Z M401 348 L396 388 L427 384 Z M334 238 L328 241 L320 241 L320 254 L331 256 L335 253 Z" />
    <path class="source-screen" d="M24 283 L168 284 L173 291 L200 437 L47 427 L42 419 L20 297 L20 287 Z" />
    <path class="source-base" d="M211 410 L270 410 L270 438 L216 438 Z" />
  </g>

  <g class="destination" mask="url(#mother-reveal)" fill="currentColor" fill-rule="evenodd" shape-rendering="geometricPrecision">
    <path mask="url(#apron-cut)" d="M365 74 L381 75 L396 82 L404 90 L410 101 L412 117 L409 127 L402 135 L406 152 L406 176 L399 199 L394 207 L382 218 L369 223 L357 224 L352 229 L352 246 L382 256 L412 270 L427 287 L454 332 L486 393 L486 406 L481 415 L472 421 L358 431 L345 430 L336 421 L285 422 L284 397 L278 394 L270 394 L270 360 L265 362 L237 394 L207 394 L201 360 L252 273 L260 264 L273 257 L303 249 L303 237 L287 223 L275 202 L271 189 L269 161 L275 135 L287 112 L299 100 L321 90 L343 90 L352 79 Z M290 144 L286 160 L287 181 L292 198 L299 211 L314 224 L327 224 L336 220 L349 207 L352 195 L364 188 L366 184 L364 173 L358 181 L349 182 L339 172 L307 158 Z M401 348 L396 388 L427 384 Z M334 238 L328 241 L320 241 L320 254 L331 256 L335 253 Z" />
    <path d="M42 362 L181 362 L174 390 L238 383 L241 400 L170 407 L166 422 L54 422 Z" />
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M67 351 C88 333 135 333 158 351" stroke-width="11" />
      <path d="M105 333 C105 324 121 324 121 333" stroke-width="9" />
      <path d="M79 315 C63 296 90 282 76 261" stroke-width="10" />
      <path d="M119 309 C102 287 132 273 118 248" stroke-width="10" />
      <path d="M157 318 C142 298 169 286 157 266" stroke-width="10" />
    </g>
  </g>
  <circle class="focus-ring" cx="126" cy="356" r="0" />
</svg>
